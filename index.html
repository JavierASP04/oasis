<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oasis Tienda</title>
  <meta name="description" content="Oasis Tienda. Perfumes árabes originales, sellados, para pedir desde el móvil.">
  <meta name="theme-color" content="#0e2344">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e2344'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23d7e6f4' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23d7e6f4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
      Oasis
    </a>
    <button type="button" class="cart-btn" id="open-cart" aria-label="Carrito" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="9" cy="20" r="1.25"/>
        <circle cx="18" cy="20" r="1.25"/>
        <path d="M3 4h2l2.2 11.2a1.5 1.5 0 0 0 1.5 1.2h8.8a1.5 1.5 0 0 0 1.5-1.2L21 8H7"/>
      </svg>
      <span id="cart-count" class="badge" hidden></span>
    </button>
  </header>

  <section class="hero" id="inicio">
    <div class="hero-copy">
      <h1>Oasis Tienda</h1>
      <p class="lede">Perfumes 100% originales, sellados. Delivery gratis en Trujillo y Pampanito.</p>
    </div>
    <div class="orb orb-a" aria-hidden="true"></div>
    <div class="orb orb-b" aria-hidden="true"></div>
  </section>
  <div class="frieze" aria-hidden="true"></div>

  <main>
    <section class="wrap catalog" id="catalogo" aria-labelledby="catalogo-title">
      <h2 id="catalogo-title" class="sr-only">Catálogo</h2>
      <div class="toolbar">
        <div class="filters" id="filters" role="group" aria-label="Filtrar por categoría">
          <button type="button" data-family="todos" aria-pressed="true">Todos</button>
          <button type="button" data-family="caballero">Caballero</button>
          <button type="button" data-family="dama">Dama</button>
          <button type="button" data-family="otros">Otros</button>
        </div>
        <div class="toolbar-end">
          <input id="search" class="search" type="search" placeholder="Buscar perfume" autocomplete="off" aria-label="Buscar perfume o casa">
          <p id="result-count" class="result-count" aria-live="polite"></p>
        </div>
      </div>
      <div id="grid" class="grid"></div>
      <p id="empty" class="empty" hidden>Ningún perfume coincide con la búsqueda.</p>
    </section>

    <ul class="perks wrap">
      <li>Sellados</li>
      <li>Originales</li>
      <li>Pedido por WhatsApp</li>
    </ul>
  </main>

  <footer class="site-footer">
    <div class="wrap foot">
      <p>Oasis Tienda</p>
      <p id="foot-contact">Pedidos por WhatsApp</p>
    </div>
  </footer>

  <div id="overlay" class="overlay" hidden></div>

  <aside id="product" class="sheet panel" role="dialog" aria-modal="true" aria-labelledby="product-title" hidden>
    <div id="product-body"></div>
  </aside>

  <aside id="cart" class="sheet drawer" role="dialog" aria-modal="true" aria-labelledby="cart-title" hidden>
    <header class="drawer-bar">
      <h2 id="cart-title">Carrito</h2>
      <button type="button" class="text-btn" id="close-cart">Cerrar</button>
    </header>
    <div id="cart-lines" class="drawer-body"></div>
    <form id="checkout" class="drawer-foot" hidden>
      <p class="subtotal"><span>Total</span> <strong id="cart-total">$0</strong></p>
      <button type="submit" class="btn btn-solid btn-block" id="checkout-btn">Enviar por WhatsApp</button>
      <textarea id="order-preview" class="order-preview" readonly hidden></textarea>
      <p id="checkout-status" class="status" role="status"></p>
    </form>
  </aside>

  <a class="wa-bubble" href="https://wa.me/584223087995" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.04 2C6.58 2 2.15 6.4 2.15 11.83c0 1.74.46 3.44 1.33 4.94L2 22l5.39-1.41a10.1 10.1 0 0 0 4.65 1.12h.01c5.46 0 9.89-4.4 9.89-9.83C21.94 6.4 17.5 2 12.04 2zm5.76 14.15c-.24.68-1.4 1.25-1.94 1.33-.5.07-1.13.1-1.82-.11-.42-.13-.95-.31-1.64-.6-2.89-1.25-4.77-4.16-4.92-4.35-.14-.2-1.17-1.55-1.17-2.96 0-1.41.74-2.1 1-2.39.26-.28.57-.35.76-.35.19 0 .38 0 .55.01.18.01.42-.07.66.5.24.58.82 2 .89 2.15.07.14.12.31.02.5-.1.2-.15.32-.29.49-.14.17-.3.37-.43.5-.14.14-.29.29-.13.57.17.28.74 1.22 1.59 1.98 1.09.97 2.01 1.27 2.3 1.42.28.14.45.12.61-.07.17-.2.7-.81.89-1.09.19-.28.38-.23.64-.14.26.1 1.65.78 1.93.92.28.14.47.21.54.33.07.12.07.69-.17 1.37z"/></svg>
  </a>

  <p id="live" class="sr-only" aria-live="polite"></p>
  <noscript><p class="wrap noscript">Activa JavaScript para ver el catálogo y el carrito.</p></noscript>

  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
